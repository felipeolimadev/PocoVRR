name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # The exec bit is not recorded in git (gradlew is tracked as mode 100644),
      # so this is required, not defensive.
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          REF="${GITHUB_REF_NAME}"
          case "$REF" in
            v*) TAG="${REF#v}" ;;
            *)  TAG="0.0.0" ;;   # workflow_dispatch on a branch
          esac

          MAJOR="${TAG%%.*}"
          REST="${TAG#*.}"
          if [ "$REST" = "$TAG" ]; then
            MINOR=0
            PATCH=0
          else
            MINOR="${REST%%.*}"
            SUB="${REST#*.}"
            if [ "$SUB" = "$REST" ]; then PATCH=0; else PATCH="${SUB%%.*}"; fi
          fi

          case "$MAJOR" in ''|*[!0-9]*) MAJOR=0 ;; esac
          case "$MINOR" in ''|*[!0-9]*) MINOR=0 ;; esac
          case "$PATCH" in ''|*[!0-9]*) PATCH=0 ;; esac

          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          [ "$CODE" -lt 1 ] && CODE=1

          echo "name=$TAG"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building versionName=$TAG versionCode=$CODE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::Decoded keystore is empty - check the base64 encoding of the secret."
            exit 1
          fi

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionCode=${{ steps.version.outputs.code }} \
            -PappVersionName=${{ steps.version.outputs.name }} \
            --no-daemon --stacktrace

      # No product flavors in app/build.gradle, so this is the real output path.
      - name: Verify APK exists
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Expected APK not found at $APK"
            find app/build/outputs -name '*.apk' -print || true
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocovrr-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          files: ${{ steps.apk.outputs.path }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
